<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药智O2O · 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #f0f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 45px 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(26, 60, 94, 0.12);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }
        .login-box:hover {
            transform: translateY(-2px);
        }
        .login-box .logo {
            font-size: 32px;
            font-weight: 700;
            color: #1a3c5e;
            margin-bottom: 6px;
            text-align: center;
        }
        .login-box .logo span {
            color: #5fc1f0;
        }
        .login-box .sub {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            font-size: 13px;
            color: #555;
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e8edf3;
            border-radius: 12px;
            font-size: 14px;
            transition: 0.3s;
            background: #fafcff;
            color: #1a3c5e;
        }
        .input-group input:focus {
            border-color: #2a6a9e;
            box-shadow: 0 0 0 4px rgba(42, 106, 158, 0.1);
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #1a3c5e, #2a6a9e);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(26, 60, 94, 0.25);
            transition: all 0.3s ease;
            margin-top: 4px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 60, 94, 0.35);
        }
        .login-btn:active {
            transform: scale(0.98);
        }
        .demo-tip {
            margin-top: 18px;
            font-size: 13px;
            color: #999;
            text-align: center;
        }
        .demo-tip strong {
            color: #1a3c5e;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .demo-tip strong:hover {
            color: #2a6a9e;
            text-decoration: underline;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            text-align: center;
            background: #fde8e8;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .login-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #ccc;
            border-top: 1px solid #f0f0f0;
            padding-top: 18px;
        }
        @media (max-width: 480px) {
            .login-box { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">💊 <span>药智</span>O2O</div>
        <div class="sub">药品大数据分析平台 · 演示登录</div>

        <form id="loginForm">
            <div class="input-group">
                <label>👤 用户名</label>
                <input type="text" id="username" value="admin" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="input-group">
                <label>🔒 密码</label>
                <input type="password" id="password" value="123456" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn">🚀 登 录</button>
            <div id="loginError" class="error-msg"></div>
        </form>

        <div class="demo-tip">
            💡 演示账号：<strong onclick="fillDemo()">admin / 123456</strong>
        </div>
        <div class="login-footer">v2.0 · O2O 药品大数据分析</div>
    </div>

    <script>
        function fillDemo() {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = '123456';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!user || !pass) {
                errorEl.textContent = '❌ 请输入用户名和密码';
                errorEl.style.display = 'block';
                setTimeout(() => { errorEl.style.display = 'none'; }, 3000);
                return;
            }

            fetch('login_api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('username', user);
                    window.location.href = 'index.html';
                } else {
                    errorEl.textContent = '❌ ' + (data.msg || '用户名或密码错误');
                    errorEl.style.display = 'block';
                    setTimeout(() => { errorEl.style.display = 'none'; }, 3000);
                }
            })
            .catch(err => {
                console.error('登录请求失败:', err);
                errorEl.textContent = '❌ 请求失败，请检查网络连接';
                errorEl.style.display = 'block';
                setTimeout(() => { errorEl.style.display = 'none'; }, 3000);
            });
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        window.addEventListener('load', function() {
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
